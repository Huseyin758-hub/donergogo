<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DönerGo</title><style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
}

header {
    background: #d71920;
    color: white;
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.product {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.product h3 {
    margin: 0 0 7px;
}

.price {
    color: #d71920;
    font-weight: bold;
    font-size: 18px;
}

.buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.buttons button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: #d71920;
    color: white;
    font-size: 25px;
}

.number {
    font-size: 20px;
    font-weight: bold;
    min-width: 20px;
    text-align: center;
}

.total {
    text-align: center;
    color: #d71920;
    font-size: 24px;
    font-weight: bold;
    margin-top: 20px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin: 6px 0 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

textarea {
    height: 90px;
}

.order {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #25D366;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style></head><body><header>
    <h1>🌯 DönerGo</h1>
    <p>Sıcak • Hızlı • Lezzetli</p>
</header><div class="container"><div class="card">
    <h2>🌯 Menümüz</h2>

    <div class="product">
        <div>
            <h3>100 gr Tavuk Döner</h3>
            <div class="price">180 TL</div>
        </div>

        <div class="buttons">
            <button id="minus100">−</button>
            <span class="number" id="count100">0</span>
            <button id="plus100">+</button>
        </div>
    </div>

    <div class="product">
        <div>
            <h3>150 gr Tavuk Döner</h3>
            <div class="price">220 TL</div>
        </div>

        <div class="buttons">
            <button id="minus150">−</button>
            <span class="number" id="count150">0</span>
            <button id="plus150">+</button>
        </div>
    </div>

    <div class="total">
        Toplam: <span id="total">0</span> TL
    </div>
</div>

<div class="card">
    <h2>🛒 Sipariş Bilgileri</h2>

    <input id="name" type="text" placeholder="Adınız Soyadınız">

    <input id="phone" type="tel" placeholder="Telefon Numaranız">

    <textarea id="address" placeholder="Teslimat adresiniz"></textarea>

    <button class="order" id="orderButton">
        📲 WhatsApp'tan Sipariş Ver
    </button>
</div>

</div><footer>
    DönerGo © 2026
</footer><script>

let count100 = 0;
let count150 = 0;

function update() {

    document.getElementById("count100").innerText = count100;
    document.getElementById("count150").innerText = count150;

    let total = (count100 * 180) + (count150 * 220);

    document.getElementById("total").innerText = total;
}

document.getElementById("plus100").onclick = function() {
    count100++;
    update();
};

document.getElementById("minus100").onclick = function() {
    if (count100 > 0) {
        count100--;
        update();
    }
};

document.getElementById("plus150").onclick = function() {
    count150++;
    update();
};

document.getElementById("minus150").onclick = function() {
    if (count150 > 0) {
        count150--;
        update();
    }
};

document.getElementById("orderButton").onclick = function() {

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;

    let total = (count100 * 180) + (count150 * 220);

    if (total === 0) {
        alert("Lütfen ürün seçin.");
        return;
    }

    if (name === "" || phone === "" || address === "") {
        alert("Lütfen sipariş bilgilerini doldurun.");
        return;
    }

    let message = "🌯 DönerGo Sipariş\n\n";

    message += "Müşteri: " + name + "\n";
    message += "Telefon: " + phone + "\n\n";

    if (count100 > 0) {
        message += "100 gr Tavuk Döner: " + count100 + " adet\n";
    }

    if (count150 > 0) {
        message += "150 gr Tavuk Döner: " + count150 + " adet\n";
    }

    message += "\nToplam: " + total + " TL\n\n";
    message += "Adres: " + address;

    let whatsapp = "905XXXXXXXXX";

    window.open(
        "https://wa.me/" + whatsapp + "?text=" + encodeURIComponent(message),
        "_blank"
    );
};

update();

</script></body>
</html>
