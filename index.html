<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DönerGo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #d71920;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #d71920;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #d71920;
      color: white;
      font-size: 17px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>🌯 DönerGo</h1>
  <p>Sıcak, hızlı, lezzetli!</p>
</header>

<div class="container">

  <div class="card">
    <h2>100 gr Tavuk Döner</h2>
    <p class="price">180 TL</p>
    <button>Sipariş Ver</button>
  </div>

  <div class="card">
    <h2>150 gr Tavuk Döner</h2>
    <p class="price">220 TL</p>
    <button>Sipariş Ver</button>
  </div>

</div>

</body>
</html>
