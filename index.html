<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DönerGo</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  background: #d71920;
  color: white;
  text-align: center;
  padding: 25px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.product {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 0;
}

.price {
  color: #d71920;
  font-weight: bold;
  font-size: 19px;
}

.quantity {
  width: 70px;
  padding: 10px;
  font-size: 18px;
}

.total {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin-top: 25px;
}

input, textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

textarea {
  height: 90px;
}

button {
  width: 100%;
  padding: 15px;
  background: #25D366;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>🌯 DönerGo</h1>
<p>Sıcak • Hızlı • Lezzetli</p>
</header>

<div class="container">

<div class="card">

<h2>Menü</h2>

<div class="product">
<div>
<h3>100 gr Tavuk Döner</h3>
<div class="price">180 TL</div>
</div>

<input
type="number"
id="adet100"
class="quantity"
min="0"
value="0"
inputmode="numeric">
</div>

<div class="product">
<div>
<h3>150 gr Tavuk Döner</h3>
<div class="price">220 TL</div>
</div>

<input
type="number"
id="adet150"
class="quantity"
min="0"
value="0"
inputmode="numeric">
</div>

<div class="total">
Toplam: <span id="toplam">0</span> TL
</div>

</div>

<div class="card">

<h2>Sipariş Bilgileri</h2>

<input id="isim" type="text" placeholder="Adınız Soyadınız">

<input id="telefon" type="tel" placeholder="Telefon Numaranız">

<textarea id="adres" placeholder="Teslimat adresiniz"></textarea>

<button onclick="whatsappSiparis()">
📲 WhatsApp'tan Sipariş Ver
</button>

</div>

</div>

<script>

function hesapla() {

  const adet100 = parseInt(document.getElementById("adet100").value) || 0;
  const adet150 = parseInt(document.getElementById("adet150").value) || 0;

  const toplam = (adet100 * 180) + (adet150 * 220);

  document.getElementById("toplam").textContent = toplam;
}

document.getElementById("adet100").addEventListener("input", hesapla);
document.getElementById("adet150").addEventListener("input", hesapla);

function whatsappSiparis() {

  const adet100 = parseInt(document.getElementById("adet100").value) || 0;
  const adet150 = parseInt(document.getElementById("adet150").value) || 0;

  const isim = document.getElementById("isim").value;
  const telefon = document.getElementById("telefon").value;
  const adres = document.getElementById("adres").value;

  const toplam = (adet100 * 180) + (adet150 * 220);

  if (toplam === 0) {
    alert("Lütfen en az bir ürün seçin.");
    return;
  }

  if (!isim || !telefon || !adres) {
    alert("Lütfen bilgilerinizi eksiksiz doldurun.");
    return;
  }

  const mesaj =
`🌯 DönerGo Sipariş

👤 Müşteri: ${isim}
📞 Telefon: ${telefon}

📦 Sipariş:
100 gr Tavuk Döner: ${adet100} adet
150 gr Tavuk Döner: ${adet150} adet

💰 Toplam: ${toplam} TL

📍 Adres:
${adres}`;

  const whatsappNumarasi = "905XXXXXXXXX";

  const url =
    "https://wa.me/" +
    whatsappNumarasi +
    "?text=" +
    encodeURIComponent(mesaj);

  window.open(url, "_blank");
}

</script>

</body>
</html>
