<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DönerGo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    color:#161616;
    padding-bottom:25px;
}

/* HEADER */
header{
    height:65px;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.logo span{
    color:#e21b23;
}

.cart{
    background:#e21b23;
    padding:8px 14px;
    border-radius:25px;
    font-weight:bold;
}

/* HERO */
.hero{
    position:relative;
    min-height:330px;
    overflow:hidden;
    background:#111;
}

.hero img{
    width:100%;
    height:330px;
    object-fit:cover;
    display:block;
    opacity:.72;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.88),
        rgba(0,0,0,.08)
    );
}

.hero-text{
    position:absolute;
    left:20px;
    right:20px;
    bottom:28px;
    color:white;
}
