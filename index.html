<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DönerGo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#151515;
    padding-bottom:90px;
}

/* ÜST MENÜ */

header{
    height:68px;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.logo b{
    color:#e51c23;
}

.cart-top{
    background:#e51c23;
    border-radius:25px;
    padding:9px 15px;
    font-weight:bold;
}


/* ANA BANNER */

.hero{
    height:390px;
    position:relative;
    overflow:hidden;
    color:white;
    display:flex;
    align-items:flex-end;

    background-image:
    linear-gradient(
        to top,
        rgba(0,0,0,.88),
        rgba(0,0,0,.15)
    ),
    url("doner.jpg");

    background-size:cover;
    background-position:center;
}

.hero-content{
    padding:28px 20px 32px;
    width:100%;
}

.badge{
    display:inline-block;
    background:#e51c23;
    padding:7px 13px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:10px;
}

.hero h1{
    font-size:39px;
    line-height:1.05;
    margin-bottom:10px;
}

.hero p{
    color:#eee;
    font-size:15px;
}


/* MENÜ */

.container{
    max-width:1000px;
    margin:auto;
    padding:28px 16px;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin-bottom:18px;
}

.section-head h2{
    font-size:27px;
}

.section-head span{
    color:#888;
    font-size:13px;
}


/* ÜRÜNLER */

.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    border:1px solid #eee;
}

.photo-wrap{
    position:relative;
    height:250px;
    overflow:hidden;
}

.product-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .3s;
}

.card:hover .product-image{
    transform:scale(1.04);
}

.weight{
    position:absolute;
    top:13px;
    left:13px;
    background:white;
    color:#111;
    padding:7px 11px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.card-body{
    padding:18px;
}

.card-body h3{
    font-size:21px;
    margin-bottom:6px;
}

.desc{
    color:#777;
    font-size:13px;
    line-height:1.5;
    min-height:39px;
    margin-bottom:13px;
}

.bottom-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.price{
    color:#e51c23;
    font-size:22px;
    font-weight:900;
}

.quantity{
    display:flex;
    align-items:center;
    background:#f0f0f0;
    border-radius:12px;
    padding:4px;
}

.quantity button{
    border:0;
    width:36px;
    height:36px;
    border-radius:9px;
    background:#111;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.quantity button:active{
    transform:scale(.9);
}

.count{
    width:32px;
    text-align:center;
    font-weight:bold;
    font-size:17px;
}


/* SEPET */

.order-box{
    margin-top:25px;
    background:#111;
    color:white;
    border-radius:22px;
    padding:22px;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.order-title{
    font-size:23px;
    font-weight:bold;
    margin-bottom:18px;
}

.selected{
    background:#222;
    border-radius:14px;
    padding:13px;
    margin-bottom:16px;
    color:#ddd;
    font-size:14px;
}

input,
textarea{
    width:100%;
    background:white;
    border:0;
    border-radius:11px;
    padding:14px;
    font-size:15px;
    margin-bottom:10px;
    outline:none;
}

textarea{
    height:85px;
    resize:none;
}

.total{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:17px 0;
    border-top:1px solid #333;
    margin-top:5px;
}

.total-label{
    color:#ccc;
}

.total-price{
    color:#ff333b;
    font-size:29px;
    font-weight:900;
}

.whatsapp{
    width:100%;
    border:0;
    border-radius:13px;
    padding:16px;
    background:#25D366;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.whatsapp:active{
    transform:scale(.98);
}

.note{
    text-align:center;
    color:#888;
    font-size:11px;
    margin-top:10px;
}


/* ALT SABİT SEPET */

.bottom-cart{
    position:fixed;
    left:12px;
    right:12px;
    bottom:12px;
    height:62px;
    background:#e51c23;
    color:white;
    border-radius:17px;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.bottom-cart-left{
    font-weight:bold;
}

.bottom-cart-price{
    font-size:21px;
    font-weight:900;
}


/* FOOTER */

footer{
    text-align:center;
    padding:25px;
    color:#999;
    font-size:12px;
}


/* TELEFON */
