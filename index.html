<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DönerGo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#171717;
}

header{
    background:#111;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#e21b23;
}

.cart{
    background:#e21b23;
    padding:9px 14px;
    border-radius:20px;
    font-weight:bold;
}

.hero{
    background:linear-gradient(135deg,#171717,#3b0909);
    color:white;
    padding:38px 20px;
    text-align:center;
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    color:#ddd;
    font-size:16px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px 15px;
}

.section-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:18px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.product-image{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
}

.card-body{
    padding:18px;
}

.card h2{
    font-size:21px;
    margin-bottom:7px;
}

.description{
    color:#777;
    font-size:14px;
    margin-bottom:14px;
}

.price{
    color:#e21b23;
    font-size:23px;
    font-weight:bold;
    margin-bottom:15px;
}

.quantity{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#f1f1f1;
    border-radius:12px;
    padding:7px;
}

.quantity button{
    width:42px;
    height:42px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.quantity button:active{
    transform:scale(.94);
}

.count{
    font-size:21px;
    font-weight:bold;
}

.order-box{
    background:white;
    margin-top:25px;
    padding:22px;
    border-radius:18px;
