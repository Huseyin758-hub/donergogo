<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DönerGo - Tavuk Döner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #d71920;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin-bottom: 0;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .product h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .price {
      color: #d71920;
      font-weight: bold;
      font-size: 19px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    textarea {
      height: 90px;
      resize: none;
    }

    .quantity {
      width: 70px;
      padding: 10px;
      margin: 0;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #25D366;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

<header>
  <h1>🌯 DönerGo</h1>
  <p>Sıcak • Hızlı • Lezzetli</p>
</header>

<div class="container">

  <div class="card">
    <h2>Menü</h2>

    <div class="product">
      <div>
        <h2>100 gr Tavuk Döner</h2>
        <div class="price">180 TL</div>
      </div>

      <input
        class="quantity"
        type="number"
        id="adet100"
        min="0"
        value="0"
        onchange="hesapla()"
      >
    </div>

    <hr>

    <div class="product">
      <div>
        <h2>150 gr Tavuk Döner</h2>
        <div class="price">220 TL</div>
      </div>

      <input
        class="quantity"
        type="number"
        id="adet150"
        min="0"
        value="0"
        onchange="hesapla()"
      >
    </div>

    <div class="total">
      Toplam: <span id="toplam">0</span> TL
    </div>
  </div>

  <div class="card">
    <h2>Sipariş Bilgileri</h2>

    <input
      type="text"
      id="isim"
      placeholder="Adınız Soyadınız"
    >

    <input
      type="tel"
      id="telefon"
      placeholder="Telefon Numaranız"
    >

    <textarea
      id="adres"
      placeholder="Teslimat adresiniz"
    ></textarea>

    <button onclick="whatsappSiparis()">
      📲 WhatsApp'tan Sipariş Ver
    </button>
  </div>

</div>

<script>

function hesapla() {
  let adet100 = Number(document.getElementById("adet100").value);
  let adet150 = Number(document.getElementById("adet150").value);

  let toplam = (adet100 * 180) + (adet150 * 220);

  document.getElementById("toplam").innerText = toplam;
}
