<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DönerGo Test</title>
</head>

<body>

<h1>DönerGo</h1>

<h2>100 gr Tavuk Döner - 180 TL</h2>

<button id="eksi">−</button>
<span id="adet">0</span>
<button id="arti">+</button>

<h2>Toplam: <span id="toplam">0</span> TL</h2>

<script>
let adet = 0;

document.getElementById("arti").addEventListener("click", function() {
  adet = adet + 1;
  document.getElementById("adet").textContent = adet;
  document.getElementById("toplam").textContent = adet * 180;
});

document.getElementById("eksi").addEventListener("click", function() {
  if (adet > 0) {
    adet = adet - 1;
    document.getElementById("adet").textContent = adet;
    document.getElementById("toplam").textContent = adet * 180;
  }
});
</script>

</body>
</html>
